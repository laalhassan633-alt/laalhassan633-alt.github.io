<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ULTRON</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --accent:#3ec6ff; --accent2:#ffb43a; --bg:#000; --panel:#0a0f14; --text:#e8f4ff; --muted:#5f7486; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,monospace; overflow:hidden; }
  body { display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid #122; }
  .brand { display:flex; align-items:center; gap:12px; }
  .logo { width:38px;height:38px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;box-shadow:0 0 18px var(--accent); }
  .logo::before{ content:''; width:14px;height:14px;border:2px solid var(--accent);border-radius:50%; box-shadow:0 0 10px var(--accent); }
  h1 { font-size:15px; letter-spacing:.3em; margin:0; color:var(--accent); font-weight:600; }
  .brand small { display:block; font-size:8px; letter-spacing:.18em; color:var(--muted); margin-top:3px; }
  select { background:var(--panel); color:var(--accent2); border:1px solid var(--accent2); border-radius:6px; padding:6px 8px; font-family:inherit; letter-spacing:.1em; }
  #orbWrap { flex:1; display:grid; place-items:center; position:relative; }
  #orb { width:min(72vw,300px); height:min(72vw,300px); border-radius:50%; position:relative; display:grid; place-items:center;
         background:radial-gradient(circle at 50% 45%, rgba(62,198,255,.25), transparent 60%); }
  .ring { position:absolute; inset:0; border-radius:50%; border:1px solid rgba(62,198,255,.35); }
  .ring.r2{ inset:8%; border-color:rgba(62,198,255,.25);} .ring.r3{ inset:16%; border-color:rgba(62,198,255,.18);}
  #orbCore { width:34%; height:34%; border-radius:50%; background:radial-gradient(circle at 50% 40%, #bfeaff, var(--accent) 55%, transparent 75%);
             box-shadow:0 0 40px var(--accent), 0 0 90px rgba(62,198,255,.6); animation:pulse 3s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{transform:scale(1);opacity:.9} 50%{transform:scale(1.12);opacity:1} }
  #orb.listening #orbCore { animation:pulse 0.7s ease-in-out infinite; }
  #status { margin-top:16px; font-size:12px; letter-spacing:.25em; color:var(--muted); }
  #micBtn { position:absolute; bottom:-8px; width:60px;height:60px;border-radius:50%; border:2px solid var(--accent2); background:#1a1206;
            color:var(--accent2); font-size:24px; display:grid;place-items:center; cursor:pointer; box-shadow:0 0 18px rgba(255,180,58,.4); }
  #micBtn.rec { background:var(--accent2); color:#000; }
  #log { max-height:34vh; overflow-y:auto; padding:8px 16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:85%; padding:9px 12px; border-radius:12px; font-size:14px; line-height:1.45; }
  .me { align-self:flex-end; background:#0d2b3a; border:1px solid var(--accent); border-radius:12px 12px 2px 12px; }
  .ai { align-self:flex-start; background:var(--panel); border:1px solid #1d2b38; border-radius:12px 12px 12px 2px; color:var(--text); }
  .ai small { display:block; color:var(--accent2); font-size:9px; letter-spacing:.2em; margin-bottom:4px; }
  #bar { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); border-top:1px solid #122; background:#05080b; }
  #in { flex:1; background:var(--panel); border:1px solid #1d2b38; border-radius:24px; padding:12px 16px; color:var(--text); font-family:inherit; font-size:14px; outline:none; }
  #send { width:46px;height:46px;border-radius:50%; border:none; background:var(--accent2); color:#000; font-size:18px; cursor:pointer; }
  #keyOverlay { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.92); display:grid; place-items:center; padding:24px; }
  #keyOverlay.hidden { display:none; }
  .keyCard { width:100%; max-width:360px; background:var(--panel); border:1px solid var(--accent2); border-radius:14px; padding:22px; }
  .keyCard h2 { color:var(--accent2); font-size:14px; letter-spacing:.2em; margin:0 0 6px; }
  .keyCard p { color:var(--muted); font-size:12px; margin:0 0 14px; }
  .keyCard input { width:100%; background:#000; border:1px solid var(--accent2); border-radius:8px; padding:12px; color:var(--text); font-family:inherit; margin-bottom:14px; }
  .keyCard button { width:100%; padding:13px; background:var(--accent2); color:#000; border:none; border-radius:8px; font-weight:700; letter-spacing:.15em; cursor:pointer; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"></div>
    <div><h1>U.L.T.R.O.N.</h1><small>N8 CORE · VOICE · VISION · ACTION</small></div>
  </div>
  <select id="persona"><option value="ULTRON">ULTRON</option><option value="NOVA">NOVA</option></select>
</header>

<div id="orbWrap">
  <div id="orb">
    <div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
    <div id="orbCore"></div>
    <div id="micBtn" title="Talk">🎤</div>
  </div>
</div>
<div id="status">STANDBY</div>
<div id="log"></div>

<div id="bar">
  <input id="in" placeholder="Message ULTRON..." autocomplete="off">
  <button id="send">↗</button>
</div>

<div id="keyOverlay">
  <div class="keyCard">
    <h2>ULTRON</h2>
    <p>Enter your ULTRON mobile API key to connect:</p>
    <input id="apiKey" type="password" placeholder="API key" autocomplete="off">
    <button id="keyGo">CONNECT</button>
  </div>
</div>

<script src="app.js"></script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}</script>
</body>
</html>
